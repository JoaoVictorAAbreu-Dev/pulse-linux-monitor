<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0a84ff">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!-- Filtro de refração (aplicado só no Chromium; demais navegadores usam blur). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="pulse-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="blooms" aria-hidden="true">
  <span class="bloom b1"></span><span class="bloom b2"></span><span class="bloom b3"></span><span class="bloom b4"></span>
</div>

<div class="app">
  <aside class="sidebar glass" aria-label="Navegação" data-i18n-aria="Navegação">
    <div class="brand">
      <img src="/favicon.svg" alt="" width="34" height="34">
      <div><strong>Pulse</strong><small id="brand-host">—</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-prefs">
      <div class="theme" role="radiogroup" aria-label="Tema" data-i18n-aria="Tema">
        <button data-theme-opt="auto" role="radio" data-i18n="Auto">Auto</button>
        <button data-theme-opt="light" role="radio" data-i18n="Claro">Claro</button>
        <button data-theme-opt="dark" role="radio" data-i18n="Escuro">Escuro</button>
      </div>
      <div class="theme lang" role="radiogroup" aria-label="Idioma" data-i18n-aria="Idioma">
        <button data-lang-opt="pt" role="radio" lang="pt-BR" title="Português (Brasil)">PT</button>
        <button data-lang-opt="en" role="radio" lang="en" title="English">EN</button>
      </div>
    </div>
  </aside>

  <main class="content">
    <header class="header glass">
      <div class="title">
        <h1 id="page-title">Pulse</h1>
        <p id="page-sub" data-i18n="Conectando…">Conectando…</p>
      </div>
      <div class="chips">
        <select class="chip host-sel" id="host-sel" aria-label="Máquina" data-i18n-aria="Máquina" hidden></select>
        <span class="chip" id="chip-self">Pulse —</span>
        <a class="chip" id="chip-alerts" href="#/alertas" data-i18n="0 alertas">0 alertas</a>
      </div>
    </header>
    <div id="page" class="page" tabindex="-1"></div>
  </main>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="dialog glass" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <div class="dlg-actions" id="dlg-actions"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/app.js"></script>
</body>
</html>
