<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Pulse">
  <title>Pulse</title>
  <defs>
    <linearGradient id="pulse-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pulse-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pulse-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3b2a8f" flood-opacity=".28"/>
    </filter>
  </defs>
  <g filter="url(#pulse-shadow)" fill="url(#pulse-g)" stroke="#fff" stroke-opacity=".85" stroke-width="2">
    <rect x="20" y="72" width="32" height="64" rx="16"/>
    <rect x="64" y="24" width="32" height="112" rx="16"/>
    <rect x="108" y="48" width="32" height="88" rx="16"/>
  </g>
  <g fill="url(#pulse-shine)">
    <rect x="27" y="78" width="7" height="30" rx="3.5"/>
    <rect x="71" y="30" width="7" height="50" rx="3.5"/>
    <rect x="115" y="54" width="7" height="40" rx="3.5"/>
  </g>
</svg>
